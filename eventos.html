<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">Final Boss</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link " href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="cliente.html">Cliente</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="eventos.html">Evento</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <main class="container py-5">
        <section class="text-center mb-5">
            <h1 class="fw-bold">Eventos de Final Boss</h1>
            <p class="text-muted">Administra Ya!</p>
        </section>
        <section class="card shadow-sm mb-5">
            <div class="card-header">
                <h2 class="h5 mb-0" id="idFormulario">Registrar evento</h2>
            </div>
            <div class="card-body">
                <form id="formEvento" novalidate>
                    <div class="mb-3">
                      <label for="idCliente" class="form-label">Cliente</label>
                      <select class="form-select" id="idCliente"></select>
                    </div>
                    <div class="mb-3">
                      <label for="idSalon" class="form-label">Salon</label>
                      <select class="form-select" id="idSalon"></select>
                    </div>
                    <div class="mb-3">
                      <label for="txtNombreEvento" class="form-label">Nombre del Evento</label>
                      <input type="text" class="form-control" id="txtNombreEvento" maxlength="100">
                    </div>
                    <div class="mb-3">
                      <label for="txtFechaEvento" class="form-label">Fecha del Evento</label>
                      <input type="date" class="form-control" id="txtFechaEvento">
                    </div>
                    <div class="mb-3">
                      <label for="txtCantidadParticipantes" class="form-label">Cantidad de Participantes</label>
                      <input type="number" class="form-control" id="txtCantidadParticipantes" min="1" step="1">
                    </div>
                    <div class="mb-3">
                      <label for="txtDuracionEvento" class="form-label">Cantidad de Horas</label>
                      <input type="number" class="form-control" id="txtDuracionEvento" min="1" max="24" step="1">
                    </div>
                    <div class="mb-3 d-none" id="grupoEstado">
                      <label for="txtEstado" class="form-label">Estado</label>
                      <select class="form-select" id="txtEstado">
                        <option value="PENDIENTE">PENDIENTE</option>
                        <option value="CONFIRMADO">CONFIRMADO</option>
                        <option value="CANCELADO">CANCELADO</option>
                        <option value="FINALIZADO">FINALIZADO</option>
                      </select>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
                    <button type="button" class="btn btn-secondary d-none" id="btnCancelar">Cancelar</button>
                </form>
            </div>
        </section>
        <section class="card shadow-sm">
            <div class="card-header">
                <h2 class="h5 mb-0">Historial de eventos</h2>
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Cliente</th>
                            <th>Salon</th>
                            <th>Evento</th>
                            <th>Fecha</th>
                            <th>Personas</th>
                            <th>Horas</th>
                            <th>Total a pagar</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaEventos"></tbody>
                </table>
            </div>
        </section>
      </main>
        
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="js/controller/eventosController.js"></script>
</html>
